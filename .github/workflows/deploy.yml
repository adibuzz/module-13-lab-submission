name: "Terraform CI/CD Pipeline"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  terraform_pipeline:
    name: "Infrastructure Pipeline"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@main
        with:
          image-tag: 'latest'
          install-awslocal: 'true'

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack S3 to be ready..."
          until curl -s http://localhost:4566/_localstack/health | grep -q "\"s3\": \"\(available\|running\)\""; do
            sleep 2
          done
          echo "LocalStack is ready!"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Initialize Working Directory
        run: terraform init

      - name: Validate Syntax
        run: terraform validate

      - name: Generate Execution Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Execute Deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

      - name: Verify Infrastructure State
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Verifying bucket exists in runner's LocalStack environment..."
          awslocal s3 ls | grep "module-13-pipeline-verification-bucket"
